/* ── USE CASE CARD ───────────────────────────────────────────────────────── */
function UseCaseCard({item, delay}) {
  const [open, setOpen] = useState(false);
  const [modalOpen, setModalOpen] = useState(false);
  const [imgExists, setImgExists] = useState(null);
  const catCls = getCatCls(item.cat);
  useEffect(() => {
    if (!modalOpen) return;
    const onKey = (e) => { if (e.key === 'Escape') setModalOpen(false); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [modalOpen]);
  const imgSrc = `assets/diagrams/${item.id}.png`;
  return (
    <div className="uc-card card-anim" style={{animationDelay:`${delay}ms`}}>
      <img src={imgSrc} style={{display:'none'}} onLoad={()=>setImgExists(true)} onError={()=>setImgExists(false)} />
      <div className="card-stripe" style={{background: getVertColor(item.vert).bg}}/>
      <div className="uc-card-head">
        <div className="badge-row">
          <span className="badge badge-vert" style={{background: getVertColor(item.vert).bg}}>{item.vert}</span>
          <span className={`badge ${getBadgeCatCls(item.cat)}`}>{getCatLabel(item.cat)}</span>
          {item.prods.map((p,i)=>(
            <span key={i} className="badge badge-prod">{p}</span>
          ))}
        </div>
      </div>
      <div className="card-divider"/>
      <div className="uc-card-body">
        <h3 className="card-title">{item.prob}</h3>
        <div className="trigger-block" style={{borderLeftColor: getVertColor(item.vert).bg}}>
          <div className="trigger-label" style={{color: getVertColor(item.vert).bg}}>Buying Trigger</div>
          <div className="trigger-text">{item.trigger}</div>
        </div>
        <div className="card-section">
          <div className="section-label">Customer Challenge</div>
          <p className="section-text">{item.challenge}</p>
        </div>
        <div className="card-section">
          <div className="section-label">How Keysight Solves It</div>
          <div className="solution-box">
            <p className="section-text">{item.solution}</p>
          </div>
        </div>
        <div className="card-section">
          <div className="section-label">Technical Capabilities</div>
          <div className="cap-list">
            {item.caps.map((c,i)=>(<span key={i} className="badge-cap">{c}</span>))}
          </div>
        </div>
        <div className="card-section" style={{marginBottom:0}}>
          <div className="section-label">Business Outcome</div>
          <p className="outcome-text">{item.outcome}</p>
        </div>
        {imgExists && (
          <div className="diagram-toggle">
            <button className="diagram-btn" onClick={()=>setModalOpen(true)}>
              <span>⊞</span> View Diagram
            </button>
          </div>
        )}
      </div>
      {modalOpen && ReactDOM.createPortal(
        <div className="lightbox-overlay" onClick={()=>setModalOpen(false)}>
          <button className="lightbox-close" onClick={()=>setModalOpen(false)}>✕</button>
          <img
            src={imgSrc}
            className="lightbox-img"
            alt={`Diagram — use case ${item.id}`}
            onClick={e=>e.stopPropagation()}
          />
        </div>,
        document.body
      )}
    </div>
  );
}

/* ── MATRIX VIEW ─────────────────────────────────────────────────────────── */
function MatrixView({cases, onSelectCell, activeCat}) {
  // Show only the selected category's verticals, or all if "All" selected
  const visibleGroups = useMemo(()=>{
    if (activeCat && activeCat !== ALL_C) {
      const cfg = CATEGORY_CONFIG[activeCat];
      return cfg ? [[activeCat, cfg]] : Object.entries(CATEGORY_CONFIG);
    }
    return Object.entries(CATEGORY_CONFIG);
  }, [activeCat]);

  const visibleVerts = useMemo(()=>
    visibleGroups.flatMap(([,cfg])=>cfg.verticals)
  , [visibleGroups]);

  const countMap = useMemo(()=>{
    const m = {};
    cases.forEach(uc=>{
      uc.prods.forEach(p=>{
        const key = `${p}||${uc.vert}`;
        m[key] = (m[key]||0)+1;
      });
    });
    return m;
  },[cases]);

  const totalCols = 1 + visibleVerts.length;

  return (
    <div>
      <div className="matrix-legend">
        <strong style={{fontSize:'12px',color:'var(--text-secondary)'}}>Legend:</strong>
        {Object.entries(CATEGORY_CONFIG).map(([key,cfg])=>(
          <div key={key} className="legend-item">
            <div className="legend-dot" style={{background:
              key==='Core'?'var(--ks-red)':key==='Tier-2'?'var(--ks-web-teal)':'var(--ks-web-yellow)'}}/>
            {cfg.label}
          </div>
        ))}
        <div className="legend-item">
          <div className="legend-dot" style={{background:'none',border:'1.5px solid #ccc',boxSizing:'border-box'}}/>
          No use cases yet
        </div>
      </div>
      <div className="matrix-wrap">
        <table className="matrix-table">
          <thead>
            {visibleGroups.length > 1 && (
              <tr>
                <th className="col-freeze" style={{textAlign:'left',width:190}}/>
                {visibleGroups.map(([catKey,catCfg])=>(
                  <th key={catKey} colSpan={catCfg.verticals.length} className={`cat-head col-${catCfg.cls}`}
                    style={{color:catKey==='Core'?'#ffaaaa':catKey==='Tier-2'?'#8fd7dd':'#ffd080'}}>
                    {catCfg.label}
                  </th>
                ))}
              </tr>
            )}
            <tr>
              <th className="col-freeze" style={{textAlign:'left',width:190}}>Product</th>
              {visibleGroups.flatMap(([catKey,catCfg])=>
                catCfg.verticals.map(v=>{
                  const vc = getVertColor(v);
                  return (
                    <th key={v} className={`vert-head col-${catCfg.cls}`}
                      style={{borderBottom:`3px solid ${vc.bg}`}}>
                      <span style={{display:'inline-block',width:8,height:8,borderRadius:'50%',background:vc.bg,marginRight:5,verticalAlign:'middle'}}/>
                      {v}
                    </th>
                  );
                })
              )}
            </tr>
          </thead>
          <tbody>
            {PRODUCT_GROUPS.map(pg=>(
              <React.Fragment key={pg.group}>
                <tr className="prod-group">
                  <td colSpan={totalCols}>{pg.group}</td>
                </tr>
                {pg.products.map(prod=>(
                  <tr key={prod} className="prod-row">
                    <td className="col-freeze">{prod}</td>
                    {visibleGroups.flatMap(([catKey,catCfg])=>
                      catCfg.verticals.map(v=>{
                        const cnt = countMap[`${prod}||${v}`]||0;
                        const cls = catCfg.cls;
                        const vc = getVertColor(v);
                        return (
                          <td key={v} className={`col-${cls}${cnt>0?' has-cases':''}`}>
                            {cnt>0?(
                              <span
                                className={`matrix-check ${cls}`}
                                title={`${cnt} use case${cnt>1?'s':''}: ${prod} × ${v}`}
                                onClick={()=>onSelectCell(prod,v)}
                                style={{cursor:'pointer', background:vc.bg}}
                              >{cnt}</span>
                            ):(
                              <span className="matrix-check empty">—</span>
                            )}
                          </td>
                        );
                      })
                    )}
                  </tr>
                ))}
              </React.Fragment>
            ))}
          </tbody>
        </table>
      </div>
      <p style={{fontSize:'11.5px',color:'var(--text-muted)',marginTop:'12px'}}>
        Use the category tabs above to filter columns · Click any number to jump to matching use cases.
      </p>
    </div>
  );
}

/* ── APP ─────────────────────────────────────────────────────────────────── */
function App() {
  const [query, setQuery]   = useState('');
  const [catFilter, setCat] = useState(ALL_C);
  const [vertFilter, setVert] = useState(ALL_V);
  const [prodFilter, setProd] = useState(ALL_P);
  const [viewMode, setView] = useState('cards'); // 'cards' | 'matrix'

  const handleCellClick = useCallback((prod, vert) => {
    setProd(prod); setVert(vert); setCat(ALL_C); setView('cards');
    window.scrollTo({top:0,behavior:'smooth'});
  }, []);

  const filtered = useMemo(()=>{
    const q = query.trim().toLowerCase();
    return USE_CASES.filter(item=>{
      const catMatch = catFilter===ALL_C || item.cat===catFilter;
      const vertMatch = vertFilter===ALL_V || item.vert===vertFilter;
      const prodMatch = prodFilter===ALL_P || item.prods.includes(prodFilter);
      const searchMatch = q==='' || [
        item.vert, item.prob, item.trigger, item.challenge,
        item.solution, item.outcome, ...item.caps, ...item.prods,
      ].join(' ').toLowerCase().includes(q);
      return catMatch && vertMatch && prodMatch && searchMatch;
    });
  },[query,catFilter,vertFilter,prodFilter]);

  const stats = useMemo(()=>{
    const verts = new Set(filtered.map(u=>u.vert));
    const prods = new Set(filtered.flatMap(u=>u.prods));
    return {count:filtered.length, verts:verts.size, prods:prods.size};
  },[filtered]);

  const reset = ()=>{ setQuery(''); setCat(ALL_C); setVert(ALL_V); setProd(ALL_P); };

  // True only when user has actively applied at least one filter
  const isFiltered = query.trim()!=='' || catFilter!==ALL_C || vertFilter!==ALL_V || prodFilter!==ALL_P;

  // Which verticals to show as quick-tabs based on current category filter
  const tabVerts = useMemo(()=>{
    if (catFilter===ALL_C) return [ALL_V,...ALL_VERTICALS_FLAT];
    return [ALL_V,...(CATEGORY_CONFIG[catFilter]?.verticals||[])];
  },[catFilter]);

  // Categorized sections for card view
  const categorySections = useMemo(()=>{
    if (catFilter!==ALL_C) {
      return [[catFilter, filtered]];
    }
    return Object.keys(CATEGORY_CONFIG).map(cat=>[cat,filtered.filter(u=>u.cat===cat)]).filter(([,arr])=>arr.length>0);
  },[catFilter,filtered]);

  return (
    <div className="app-shell">

      {/* ── LEFT SIDEBAR ── */}
      <aside className="sidebar">
        <div className="sidebar-logo">
          <KeysightLogo/>
        </div>

        <div className="sidebar-search">
          <div className="sidebar-search-wrap">
            <svg className="sidebar-search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input
              className="sidebar-search-input"
              type="text"
              placeholder="Search use cases…"
              value={query}
              onChange={e=>setQuery(e.target.value)}
            />
          </div>
        </div>

        <div className="sidebar-section">
          <div className="sidebar-section-label">Category</div>
          <button className={`sidebar-nav-item${catFilter===ALL_C?' active':''}`} onClick={()=>{setCat(ALL_C);setVert(ALL_V);}}>
            All Categories
            <span className="sidebar-count">{USE_CASES.length}</span>
          </button>
          {Object.entries(CATEGORY_CONFIG).map(([key,cfg])=>{
            const cnt = USE_CASES.filter(u=>u.cat===key).length;
            const dotColor = key==='Core'?'var(--ks-red)':key==='Tier-2'?'var(--ks-web-teal)':' var(--ks-web-yellow)';
            return (
              <button key={key} className={`sidebar-nav-item${catFilter===key?' active':''}`} onClick={()=>{setCat(key);setVert(ALL_V);}}>
                <span className="sidebar-dot" style={{background:dotColor}}/>
                {cfg.label}
                <span className="sidebar-count">{cnt}</span>
              </button>
            );
          })}
        </div>

        <div className="sidebar-section">
          <div className="sidebar-section-label">Vertical</div>
          <select className="sidebar-select" value={vertFilter} onChange={e=>setVert(e.target.value)}>
            <option value={ALL_V}>All Verticals</option>
            {ALL_VERTICALS_FLAT.map(v=>(<option key={v} value={v}>{v}</option>))}
          </select>
        </div>

        <div className="sidebar-section">
          <div className="sidebar-section-label">Product</div>
          <select className="sidebar-select" value={prodFilter} onChange={e=>setProd(e.target.value)}>
            {PROD_LIST.map(p=>(<option key={p} value={p}>{p}</option>))}
          </select>
        </div>

        {isFiltered && (
          <div style={{padding:'6px 14px 10px'}}>
            <button className="reset-btn" style={{width:'100%',justifyContent:'center'}} onClick={reset}>
              <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><path d="M1 1l8 8M9 1L1 9" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
              Clear filters
            </button>
          </div>
        )}

        <div className="sidebar-bottom">
          <button className={`sidebar-view-btn${viewMode==='cards'?' active':''}`} onClick={()=>setView('cards')}>
            <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
            Cards
          </button>
          <button className={`sidebar-view-btn${viewMode==='matrix'?' active':''}`} onClick={()=>setView('matrix')}>
            <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="14" height="2" rx="1"/><rect x="1" y="5" width="14" height="2" rx="1"/><rect x="1" y="9" width="14" height="2" rx="1"/><rect x="1" y="13" width="14" height="2" rx="1"/></svg>
            Matrix
          </button>
        </div>
      </aside>

      {/* ── MAIN CONTENT ── */}
      <div className="content-area">
        <div className="hero-new">
          <div className="hero-eyebrow-new">Sales Enablement · Channel Strategy</div>
          <h1 className="hero-headline">Accelerate every customer conversation with the right network test use case.</h1>
          <p className="hero-desc-new">
            Built for Sales Teams and Channel Partners, this hub turns complex network test scenarios into clear, credible next steps. Explore proven use cases, connect customer challenges to Keysight NTS solutions, and move faster with confidence.
          </p>
          <div className="hero-actions">
            <button className="hero-btn primary" onClick={()=>{document.querySelector('.cards-area')?.scrollIntoView({behavior:'smooth',block:'start'});}}>Explore proven use cases</button>
            <button className="hero-btn secondary" onClick={()=>setQuery('channel')}>See partner-ready scenarios</button>
          </div>
          <div className="hero-stats-new">
            <div className="hs-item">
              <span className={`hs-num${isFiltered?' red':''}`}>{isFiltered ? stats.count : USE_CASES.length}</span>
              <span className="hs-label">{isFiltered ? 'matching' : 'total'} use cases</span>
            </div>
            <div className="hs-sep"/>
            <div className="hs-item">
              <span className="hs-num">{isFiltered ? stats.prods : ALL_PRODUCTS.length}</span>
              <span className="hs-label">products</span>
            </div>
            <div className="hs-sep"/>
            <div className="hs-item">
              <span className="hs-num">{isFiltered ? stats.verts : ALL_VERTICALS_FLAT.length}</span>
              <span className="hs-label">verticals</span>
            </div>
          </div>
          <div className="hero-proof-row">
            <div className="hero-proof-card">
              <div className="hero-proof-title">Built for</div>
              <div className="hero-proof-value">Sales Teams</div>
            </div>
            <div className="hero-proof-card">
              <div className="hero-proof-title">Trusted by</div>
              <div className="hero-proof-value">Channel Partners</div>
            </div>
            <div className="hero-proof-card">
              <div className="hero-proof-title">Outcome</div>
              <div className="hero-proof-value">Faster conversations</div>
            </div>
          </div>
          {isFiltered && (
            <div className="hero-active-filters">
              {catFilter!==ALL_C && <span className="active-filter-chip">{catFilter} <button className="af-clear" onClick={()=>setCat(ALL_C)}>×</button></span>}
              {vertFilter!==ALL_V && <span className="active-filter-chip">{vertFilter} <button className="af-clear" onClick={()=>setVert(ALL_V)}>×</button></span>}
              {prodFilter!==ALL_P && <span className="active-filter-chip">{prodFilter} <button className="af-clear" onClick={()=>setProd(ALL_P)}>×</button></span>}
              {query && <span className="active-filter-chip">"{query}" <button className="af-clear" onClick={()=>setQuery('')}>×</button></span>}
            </div>
          )}
        </div>

        <div className="premium-section">
          <div className="premium-section-header">Why teams use this hub</div>
          <div className="premium-section-title">Turn complexity into a clear path to relevance.</div>
          <p className="premium-section-copy">
            Sales teams need more than broad product knowledge. They need a fast, credible way to connect customer pain points to the right solutions. This hub helps teams uncover the most relevant use cases, shorten discovery time, and guide conversations with confidence.
          </p>
          <div className="benefit-grid">
            <div className="benefit-card">
              <h3>For Sales Teams</h3>
              <p>Move from generic positioning to targeted conversations built around real customer challenges and measurable outcomes.</p>
            </div>
            <div className="benefit-card">
              <h3>For Channel Partners</h3>
              <p>Quickly identify partner-ready scenarios, strengthen solution storytelling, and improve handoff quality with less effort.</p>
            </div>
            <div className="benefit-card">
              <h3>For Solution Engineers</h3>
              <p>Surface the most relevant use cases and technical capabilities without sifting through disconnected content.</p>
            </div>
          </div>
        </div>

        <div className="cta-band">
          <div>
            <h3>Ready to guide the next conversation?</h3>
            <p>Start exploring the use cases that best match your customer’s priorities and move from discovery to action faster.</p>
          </div>
          <button className="hero-btn primary" onClick={()=>{document.querySelector('.cards-area')?.scrollIntoView({behavior:'smooth',block:'start'});}}>Start exploring</button>
        </div>

        <div className="cards-area">
          {viewMode==='matrix' ? (
            <>
              <div className="cards-area-header">
                <div className="cards-area-count">
                  Matrix shows coverage across <strong>{ALL_VERTICALS_FLAT.length}</strong> verticals and <strong>{ALL_PRODUCTS.length}</strong> products
                </div>
              </div>
              <MatrixView cases={USE_CASES} onSelectCell={handleCellClick} activeCat={catFilter}/>
            </>
          ) : !isFiltered ? (
            <div className="prompt-state">
              <div className="prompt-inner">
                <div className="prompt-icon">🎯</div>
                <h2 className="prompt-title">Select a filter to explore use cases</h2>
                <p className="prompt-text">
                  Use the <strong>category</strong> or <strong>vertical/product</strong> filters in the sidebar, or the <strong>search bar</strong> above to surface targeted use cases.
                </p>
                <div className="prompt-shortcuts">
                  <div className="shortcut-label">Quick start by category:</div>
                  <div className="shortcut-grid">
                    {Object.entries(CATEGORY_CONFIG).map(([key,cfg])=>{
                      const cnt = USE_CASES.filter(u=>u.cat===key).length;
                      return (
                        <button key={key} className={`shortcut-card sc-${getCatCls(key)}`}
                          onClick={()=>{setCat(key);setVert(ALL_V);}}>
                          <div className="sc-icon">{cfg.icon}</div>
                          <div className="sc-label">{cfg.label}</div>
                          <div className="sc-desc">{cfg.verticals.join(' · ')}</div>
                          <div className="sc-count">{cnt} use cases</div>
                        </button>
                      );
                    })}
                  </div>
                  <div className="shortcut-label" style={{marginTop:28}}>Or jump directly to a vertical:</div>
                  <div className="vert-pill-grid">
                    {ALL_VERTICALS_FLAT.map(v=>{
                      const vc = getVertColor(v);
                      return (
                        <button key={v}
                          className="vert-pill"
                          style={{borderColor:vc.border, color:vc.text, background:'white'}}
                          onMouseEnter={e=>{e.currentTarget.style.background=vc.bg;e.currentTarget.style.color='white';e.currentTarget.style.borderColor=vc.bg;}}
                          onMouseLeave={e=>{e.currentTarget.style.background='white';e.currentTarget.style.color=vc.text;e.currentTarget.style.borderColor=vc.border;}}
                          onClick={()=>setVert(v)}>
                          <span style={{display:'inline-block',width:7,height:7,borderRadius:'50%',background:vc.bg,marginRight:6,verticalAlign:'middle'}}/>
                          {v}
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          ) : filtered.length>0 ? (
            <>
              <div className="cards-area-header">
                <div className="cards-area-count">
                  Showing <strong>{filtered.length}</strong> of {USE_CASES.length} use cases
                </div>
              </div>
              {categorySections.map(([cat, catCases], si)=>{
                if (catCases.length===0) return null;
                const cfg = CATEGORY_CONFIG[cat];
                return (
                  <div key={cat}>
                    {catFilter===ALL_C && (
                      <>
                        {si>0 && <div className="section-divider"><div className="divider-line"/><div className="divider-label">{cfg?.label||cat}</div><div className="divider-line"/></div>}
                        <div className={`cat-header ${getCatCls(cat)}`}>
                          <div className="cat-icon">{cfg?.icon}</div>
                          <div className="cat-info">
                            <div className="cat-title">{cfg?.label||cat}</div>
                            <div className="cat-subtitle">{cfg?.desc}</div>
                          </div>
                          <div className="cat-pills">
                            {cfg?.verticals.map(v=>{
                              const vc = getVertColor(v);
                              return (
                                <span key={v} className="cat-pill"
                                  style={{background:vc.light, borderColor:vc.border, color:vc.text}}
                                  onMouseEnter={e=>{e.currentTarget.style.background=vc.bg;e.currentTarget.style.color='white';e.currentTarget.style.borderColor=vc.bg;}}
                                  onMouseLeave={e=>{e.currentTarget.style.background=vc.light;e.currentTarget.style.color=vc.text;e.currentTarget.style.borderColor=vc.border;}}
                                  onClick={()=>setVert(v)}>{v}</span>
                              );
                            })}
                          </div>
                        </div>
                      </>
                    )}
                    <div className="card-grid">
                      {catCases.map((item,i)=>(
                        <UseCaseCard key={item.id} item={item} delay={Math.min(i*25,250)}/>
                      ))}
                    </div>
                  </div>
                );
              })}
            </>
          ) : (
            <div className="empty-state">
              <div className="empty-icon">🔍</div>
              <div className="empty-title">No use cases found</div>
              <p className="empty-text">No use cases match your current filters. Try broadening your search or resetting the filters.</p>
              <button className="empty-btn" onClick={reset}>Reset filters</button>
            </div>
          )}
        </div>
      </div>

      {/* ── RIGHT PANEL ── */}
      <aside className="right-panel">
        <div className="rp-inner">
          <div className="rp-eyebrow">Recently Added</div>
          <div className="rp-title">Latest Use Cases</div>
          {[...USE_CASES].sort((a,b)=>b.id-a.id).slice(0,3).map(item=>(
            <div key={item.id} className="rp-item" onClick={()=>{setVert(item.vert);setCat(item.cat);setQuery('');}}>
              <div className="rp-item-vert">{item.vert}</div>
              <div className="rp-item-name">{item.prob}</div>
              <div className="rp-item-prods">{item.prods.slice(0,2).join(' · ')}</div>
            </div>
          ))}

        </div>
      </aside>

      {/* FOOTER */}
      <footer className="site-footer" style={{gridColumn:'1 / -1'}}>
        <div className="footer-text">
          <strong>Keysight Technologies</strong> · Network Test Solutions Use Case Hub · 2026
        </div>
        <div className="footer-text">
          Built for Sales Teams, Channel Partners, and Solution Engineers to uncover relevant use cases quickly and guide every conversation with clarity.
        </div>
      </footer>

    </div>
  );
}



ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
